<main id="inhalt" class="account">
  <div class="wrap">
    <div class="login-card">

      <h1>Neues Passwort setzen</h1>

      <div class="form-msg" id="meldung" role="alert"></div>

      <p class="sub" id="pruefe-link">Link wird geprüft …</p>

      <form id="form-passwort-neu" novalidate hidden>
        <div class="field">
          <label for="passwort">Neues Passwort</label>
          <input type="password" id="passwort" name="passwort" class="eingabe-text"
                 autocomplete="new-password" minlength="8" required>
          <p class="hint">Mindestens 8 Zeichen.</p>
        </div>

        <div class="field">
          <label for="passwort2">Passwort bestätigen</label>
          <input type="password" id="passwort2" name="passwort2" class="eingabe-text"
                 autocomplete="new-password" minlength="8" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Passwort speichern</button>
      </form>

      <div id="neu-anfordern" hidden>
        <a href="passwort-vergessen.html" class="btn btn-outline btn-block">
          Neuen Link anfordern
        </a>
      </div>

      <p class="login-foot">
        <a href="anmelden.html">Zurück zur Anmeldung</a>
      </p>
    </div>
  </div>
</main>
